id = "override"
name = "Override"
board = { linear = { installation = "acme", project = "OVERRIDE" } }
spec_source = "~/dev/spec"

[[repos]]
name = "backend"
path = "~/dev/override-backend"
role = "backend"
check = "swift test"

[[routing]]
work_kind = "review"
route = "codex/gpt-5.4/high"

[[routing]]
work_kind = "impl"
repo_role = "web"
route = "claude/sonnet/low"

[[routing]]
work_kind = "arch"
route = "claude/opus/high"
fallbacks = ["codex/gpt-5.4/high"]
