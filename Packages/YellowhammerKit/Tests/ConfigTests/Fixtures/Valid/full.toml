# Machine-wide configuration.

[board.linear.installations.acme]
credential = "keychain:linear-acme"
workspace = "workspace-1"
app_user = "app-user-1"
operator = "linear-user-1"

[board.linear.installations."acme corp"]
credential = "keychain:linear-acme-corp"
workspace = "workspace-2"
app_user = "app-user-2"
operator = ""

[github]
credential = "keychain:github"

[cli.claude]
executable = "/opt/homebrew/bin/claude"

[cli.codex]

[cli."local agent"]
executable = '/usr/local/bin/agent'

# Base Routing Table.

[[routing]]
route = "claude/sonnet"

[[routing]]
work_kind = "impl.boilerplate"
repo_role = "backend"
route = "claude/sonnet/low"
fallbacks = [
  "codex/gpt-5.4/high",
  "claude/haiku",                        # inherits the primary route's effort
  { cli = "claude", model = "opus", effort = "high" },
  { cli = "codex", model = "gpt-5.4" },  # inherits the primary route's effort
]

[[routing]]
work_kind = "*"
repo_role = "mobile"
route = { cli = "codex", model = "gpt-5.4" }
fallbacks = ["claude/opus"]

[[routing]]
work_kind = "review"
repo_role = "*"
fallbacks = []

[routing.route]
cli = "claude"
model = "opus"
effort = "high"

[[routing]]
work_kind = "impl"
repo_role = "data-pipeline"
route = { cli = "claude", model = "sonnet", effort = "xhigh" }
