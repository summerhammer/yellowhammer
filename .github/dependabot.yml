version: 2
updates:
  # Swift Package Manager dependencies
  - package-ecosystem: swift
    directory: /Packages/YellowhammerKit
    schedule:
      interval: weekly
    groups:
      minor-patch-dependencies:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # Note: Yellowhammer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    # is a separate Xcode-managed file and cannot be updated by Dependabot.
    # When SPM package pins change, manually re-resolve in Xcode via:
    #   xcodebuild -resolvePackageDependencies

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch-dependencies:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: deps
    labels:
      - dependencies
