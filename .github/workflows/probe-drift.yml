name: Probe drift unit tests

on:
  pull_request:
    paths:
      - "scripts/ci/check_probe_drift.py"
      - "scripts/ci/tests/test_check_probe_drift.py"
      - ".github/workflows/probe-drift.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/ci/check_probe_drift.py"
      - "scripts/ci/tests/test_check_probe_drift.py"
      - ".github/workflows/probe-drift.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  unit-tests:
    name: Probe drift unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These are unit tests only: a stubbed `yh` and canned probe output. The probe itself needs
      # a Mac with authenticated agent CLIs and the Ledger holding earlier Probe Results, and is
      # never run here — see probe-drift-live.yml (#199).
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_check_probe_drift.py' -v
