name: Release scripts

# Unit-tests and lints the release scripts (roadmap P16.2, P16.3, P16.4). Runs on
# ubuntu-latest and uses no secrets: it never signs or notarizes anything, only checks
# release-version.sh's tag parsing, notarize.sh and package-dmg.sh against stubbed
# `xcrun`/`ditto`/`codesign`/`spctl`/`hdiutil`, release-notes.sh against a throwaway git
# repository, and the shell scripts' style.

on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - 'scripts/ci/tests/test_release_version.py'
      - 'scripts/ci/tests/test_notarize.py'
      - 'scripts/ci/tests/test_package_dmg.py'
      - 'scripts/ci/tests/test_release_notes.py'
      - 'scripts/ci/tests/test_appcast.py'
      - '.github/workflows/release-scripts.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/release/**'
      - 'scripts/ci/tests/test_release_version.py'
      - 'scripts/ci/tests/test_notarize.py'
      - 'scripts/ci/tests/test_package_dmg.py'
      - 'scripts/ci/tests/test_release_notes.py'
      - 'scripts/ci/tests/test_appcast.py'
      - '.github/workflows/release-scripts.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-scripts:
    name: Test and lint release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run unit tests
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p 'test_release_version.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_notarize.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_package_dmg.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_release_notes.py' -v
          python3 -m unittest discover -s scripts/ci/tests -p 'test_appcast.py' -v

      - name: Shellcheck release scripts
        run: shellcheck scripts/release/*.sh
