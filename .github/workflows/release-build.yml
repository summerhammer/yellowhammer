name: Release build

# Builds a signed, versioned Release .app from a tag (roadmap P16.2), submits it for
# notarization, staples the ticket, and verifies the result (roadmap P16.3), then
# packages a signed, notarized DMG plus checksums and publishes a GitHub release
# (roadmap P16.4).
#
# Reusable, called by release.yml's `build` job once release-please tags a release and
# creates its draft GitHub Release (`needs.release-please.outputs.tag_name`). Also
# callable directly via `workflow_dispatch` to rebuild an already-tagged release (e.g.
# after a signing fix), which re-publishes over the existing draft or published release.
# Never add a pull_request trigger: it would hand the signing and notarization secrets to
# code on any PR branch. See doc/signing-identity.md for the secrets and their ownership,
# and doc/release-build.md for the versioning scheme, the notarization step and packaging.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-build:
    name: Release build
    runs-on: macos-26
    timeout-minutes: 110
    permissions:
      contents: write
    env:
      XCODE_VERSION: "26.6"
      DEVELOPER_TEAM_ID: A2SJL2N487
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        env:
          RESOLVED_TAG: ${{ inputs.tag }}
        run: echo "RELEASE_TAG=$RESOLVED_TAG" >> "$GITHUB_ENV"

      - name: Compute release version
        run: scripts/release/release-version.sh "$RELEASE_TAG"

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print versions
        run: |
          xcodebuild -version
          swift --version

      - name: Set up signing identity and notarization credential
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: scripts/release/setup-signing.sh

      - name: Build Release app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Yellowhammer.xcodeproj \
            -scheme Yellowhammer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            CLANG_COVERAGE_MAPPING=NO \
            build | tee build/xcodebuild.log

      - name: Sign embedded Sparkle helpers
        run: scripts/release/sign-sparkle.sh build/DerivedData/Build/Products/Release/Yellowhammer.app

      - name: Verify release build
        run: |
          scripts/release/verify-release-build.sh \
            build/DerivedData/Build/Products/Release/Yellowhammer.app \
            "$MARKETING_VERSION" "$CURRENT_PROJECT_VERSION" "$SPARKLE_PUBLIC_ED_KEY"

      - name: Notarize, staple and verify
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          mkdir -p build/notarization build/artifacts
          export NOTARIZED_ZIP_NAME="Yellowhammer-$MARKETING_VERSION-$CURRENT_PROJECT_VERSION.zip"
          scripts/release/notarize.sh \
            build/DerivedData/Build/Products/Release/Yellowhammer.app \
            build/notarization
          cp "build/notarization/$NOTARIZED_ZIP_NAME" "build/artifacts/$NOTARIZED_ZIP_NAME"

      - name: Package disk image
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          NOTARIZED_ZIP_NAME="Yellowhammer-$MARKETING_VERSION-$CURRENT_PROJECT_VERSION.zip"
          scripts/release/package-dmg.sh \
            build/DerivedData/Build/Products/Release/Yellowhammer.app \
            build/artifacts \
            "Yellowhammer-$MARKETING_VERSION-$CURRENT_PROJECT_VERSION" \
            "build/artifacts/$NOTARIZED_ZIP_NAME"
          # dmg-notarization-submit.json and dmg-notarization-log.json land in
          # build/artifacts/ directly — already covered by the artifact upload below.

      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          NOTARIZED_ZIP_NAME="Yellowhammer-$MARKETING_VERSION-$CURRENT_PROJECT_VERSION.zip"
          scripts/release/appcast.sh \
            "build/artifacts/$NOTARIZED_ZIP_NAME" \
            "$MARKETING_VERSION" "$CURRENT_PROJECT_VERSION" "$RELEASE_TAG" \
            build/artifacts

      - name: Write release notes
        run: scripts/release/release-notes.sh "$RELEASE_TAG" > build/artifacts/spec-notes.md

      - name: Publish GitHub release
        # release-please is the only thing that creates a release: it opens this tag's
        # release as a draft (or, on workflow_dispatch, one already exists to rebuild).
        # A missing release here means release-please didn't run first, so fail loudly
        # rather than create one out of band.
        #
        # Idempotent for re-runs (workflow_dispatch, or a retried job): the existing body
        # is release-please's changelog, optionally followed by a previous run's spec
        # section. Strip everything from the `<!-- spec-notes -->` marker onward (CRs
        # normalized first, since release bodies from the API can carry \r\n) and append
        # a fresh spec section below a fresh marker.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body \
            --jq .body > build/artifacts/existing-body.md 2>/dev/null; then
            echo "error: no GitHub release found for $RELEASE_TAG;" \
              "releases are created only by release-please, not by this workflow" >&2
            exit 1
          fi

          tr -d '\r' < build/artifacts/existing-body.md > build/artifacts/existing-body.lf.md
          changelog="$(sed '/^<!-- spec-notes -->$/,$d' build/artifacts/existing-body.lf.md)"
          {
            printf '%s\n\n' "$changelog"
            echo "<!-- spec-notes -->"
            echo
            cat build/artifacts/spec-notes.md
          } > build/artifacts/release-notes.md

          gh release upload "$RELEASE_TAG" \
            build/artifacts/*.dmg build/artifacts/*.zip build/artifacts/SHA256SUMS \
            build/artifacts/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Yellowhammer $MARKETING_VERSION" \
            --notes-file build/artifacts/release-notes.md \
            --draft=false \
            --latest

      - name: Upload release build artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: |
            build/artifacts/
            build/xcodebuild.log
            build/notarization/notarization-submit.json
            build/notarization/notarization-log.json

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "${NOTARY_API_KEY_PATH:-}"
