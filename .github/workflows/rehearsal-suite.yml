name: Rehearsal suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  rehearsal-suite:
    name: Rehearsal suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # These are unit tests only: fake transports, fake processes and synthetic Journals. The
      # suite itself needs a Mac with Orca ADE, the scratch credentials and the network, and is
      # never run here.
      - name: Run unit tests
        run: python3 -m unittest discover -s scripts/rehearsal-suite/tests -v
