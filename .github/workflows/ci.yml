name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# An explicit `shell: bash` runs steps with `-eo pipefail`, so `cmd | tee log` fails when `cmd` fails.
defaults:
  run:
    shell: bash

jobs:
  # Lint, Test and Build are required checks on main. A workflow skipped by `paths-ignore`
  # never reports them, so a docs-only PR waits on them forever; a job skipped by `if:`
  # reports "Skipped", which satisfies the ruleset. So the workflow always runs, and this
  # job decides whether anything but documentation changed.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter out documentation-only changes
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same set the old `paths-ignore` skipped: doc/**, docs/**, root-level *.md, LICENSE.
          code_files=$(git diff --name-only "$BASE...$HEAD" | grep -Ev '^(docs?/|[^/]+\.md$|LICENSE$)' || true)
          if [[ -n "$code_files" ]]; then
            echo "Non-documentation changes:"
            echo "$code_files"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documentation-only change; Lint, Test and Build are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Pinned: ubuntu-latest is now 26.04, which lacks libxml2.so.2, so the
    # SwiftLint 0.65.0 Linux binary will not load.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the source-mtime script
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_source_mtimes.py' -v

      - name: Download SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.0"
          SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
        run: |
          dir="$RUNNER_TEMP/swiftlint"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" \
            -o "$dir/swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $dir/swiftlint.zip" | sha256sum --check
          unzip -q "$dir/swiftlint.zip" -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/swiftlint" version

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Generate lint report
        if: always()
        run: |
          mkdir -p /tmp/lint-reports
          swiftlint lint --reporter json > /tmp/lint-reports/swiftlint.json || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: /tmp/lint-reports/swiftlint.json

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print versions
        run: |
          xcodebuild -version
          swift --version

      # A PR can restore main's cache or its own previous cache; PR caches are scoped to its
      # merge ref and cannot be restored by main or another PR. Only main saves this entry:
      # at ~800 MB a revision, per-PR saves would push main's entry out of the 10 GB
      # repository cache (least recently restored goes first) and leave the next PR cold.
      # PRs restore main's entry and the mtime restore keeps unchanged modules warm.
      # SwiftPM rebuilds any source whose mtime differs from the one it recorded, and a checkout
      # stamps every file with the checkout time: without the mtime restore below, every one of
      # our modules recompiles on every run and the cache saves only the dependencies.
      - name: Restore SwiftPM cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/YellowhammerKit/.build
            Tools/LandingScreenshots/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Packages/YellowhammerKit/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Packages/YellowhammerKit/Package.resolved') }}-

      - name: Restore source mtimes
        run: python3 scripts/ci/source_mtimes.py restore --root Packages/YellowhammerKit

      - name: Resolve dependencies
        run: swift package --package-path Packages/YellowhammerKit resolve

      - name: Compile tests
        timeout-minutes: 12
        run: |
          mkdir -p build/test-results
          swift build --package-path Packages/YellowhammerKit --build-tests --disable-index-store 2>&1 | tee build/test-results/compile.log

      - name: Build landing screenshot showcase
        timeout-minutes: 3
        run: swift build --package-path Tools/LandingScreenshots --disable-index-store

      - name: Summarize SwiftPM cache
        if: always()
        env:
          CACHE_HIT: ${{ steps.swiftpm-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.swiftpm-cache.outputs.cache-matched-key }}
        run: |
          {
            echo "### SwiftPM cache"
            echo "- exact hit: \`${CACHE_HIT:-false}\`"
            echo "- matched key: \`${MATCHED_KEY:-none (cold)}\`"
            echo "- saved by this run: \`${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Save before executing tests so a failure does not discard a successful compilation.
      # Both test steps use this build, including on a cache miss.
      - name: Record source mtimes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci/source_mtimes.py record --root Packages/YellowhammerKit

      - name: Save SwiftPM cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Packages/YellowhammerKit/.build
            Tools/LandingScreenshots/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      # These suites spawn real process trees and assert wall-clock bounds (grace periods,
      # prompt cancellation, sweeps). On the hosted runner's few cores, sharing the process
      # with the other parallel tests can starve subprocesses past those bounds, so they
      # run on their own, serially, after everything else. Starting them all at once
      # also pushes the runner past its per-user process limit (posix_spawn EAGAIN, errno 35).
      #
      # Both steps run `swift test` under `script`, a pseudo-terminal: through a plain pipe its
      # output is block-buffered and only lands when the process exits, so a hung run left an
      # empty log and never named the test it hung in. Each step has its own timeout so a
      # hung test fails before the job's overall timeout.
      - name: Run tests
        timeout-minutes: 12
        env:
          PROCESS_SUITES: ProcessTreeTests|AgentCLIProcess|ProcessFencer|WorktreeCheckTests|TerminationSignalsTests|ExpiredLeaseSweepIntegrationTests|WorktreeReconcilerContinuedTests|AgentModelDiscoveryProcessTests|InstallationRefreshLockProcessTests|ScheduledExecutableTests|AttemptAbortTests|EngineStopTests|GitRunnerTests|CLIProbe|PromptWatchWatchdog|OrcaTab|OrcaDirectSpawn
        run: |
          mkdir -p build/test-results
          script -q /dev/null swift test --package-path Packages/YellowhammerKit --skip-build --parallel --skip "$PROCESS_SUITES" --xunit-output build/test-results/tests.xml </dev/null 2>&1 | tee build/test-results/test.log

      - name: Run process-timing tests
        timeout-minutes: 5
        env:
          PROCESS_SUITES: ProcessTreeTests|AgentCLIProcess|ProcessFencer|WorktreeCheckTests|TerminationSignalsTests|ExpiredLeaseSweepIntegrationTests|WorktreeReconcilerContinuedTests|AgentModelDiscoveryProcessTests|InstallationRefreshLockProcessTests|ScheduledExecutableTests|AttemptAbortTests|EngineStopTests|GitRunnerTests|CLIProbe|PromptWatchWatchdog|OrcaTab|OrcaDirectSpawn
        run: |
          script -q /dev/null swift test --package-path Packages/YellowhammerKit --skip-build --no-parallel --filter "$PROCESS_SUITES" --xunit-output build/test-results/process-tests.xml </dev/null 2>&1 | tee build/test-results/process-test.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/test-results/

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Print versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache source packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/SourcePackages
          key: sourcepackages-${{ hashFiles('Yellowhammer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            sourcepackages-

      # Cache compiled output as well as dependency checkouts. As with the test cache,
      # PRs can reuse their own previous revision without publishing a cache to main. This
      # entry is smaller than the SwiftPM one, so PR revisions still save it.
      - name: Restore Xcode build cache
        id: xcode-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Yellowhammer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.XCODE_VERSION }}-${{ hashFiles('Yellowhammer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-

      - name: Summarize Xcode build cache
        if: always()
        env:
          CACHE_HIT: ${{ steps.xcode-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.xcode-cache.outputs.cache-matched-key }}
        run: |
          {
            echo "### Xcode build cache"
            echo "- exact hit: \`${CACHE_HIT:-false}\`"
            echo "- matched key: \`${MATCHED_KEY:-none (cold)}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Preserve timestamps only for unchanged tracked files, including the app and local
      # package sources, so Xcode can reuse the restored build without hiding real edits.
      - name: Restore source mtimes
        run: python3 scripts/ci/source_mtimes.py restore --root . --manifest build/DerivedData/source-mtimes.json

      - name: Build app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Yellowhammer.xcodeproj \
            -scheme Yellowhammer \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Yellowhammer.xcresult \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            build | tee build/xcodebuild.log

      - name: Verify app bundle
        run: scripts/ci/verify_app_bundle.sh build/DerivedData/Build/Products/Debug/Yellowhammer.app

      - name: Record source mtimes
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci/source_mtimes.py record --root . --manifest build/DerivedData/source-mtimes.json

      - name: Save Xcode build cache
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/DerivedData
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            build/xcodebuild.log
            build/Yellowhammer.xcresult/
